---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111517" />
    <title>Grizzly — Your AI development OS</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #111517;
        color: #f4f2ed;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #111517;
      }

      body { min-height: 100vh; }

      .page {
        width: 100%;
        min-height: 100vh;
        padding: 26px clamp(22px, 4vw, 52px) 44px;
        overflow: hidden;
      }

      .masthead {
        padding: 0 0 16px;
        border-bottom: 1px solid #303638;
        text-align: center;
      }

      .masthead h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.2;
      }

      .masthead p { margin: 10px 0 0; }

      .artwork-stage {
        position: relative;
        height: clamp(250px, 35vh, 340px);
        margin: 0 0 24px;
        background: transparent;
      }

      .bear {
        position: absolute;
        top: -100px;
        right: 0;
        display: block;
        width: min(24vw, 240px);
        height: auto;
        background: transparent;
      }

      .idea-card {
        width: 100%;
        margin: 0;
        padding: 28px;
        border: 1px solid #394143;
        border-radius: 18px;
        background: #252b2d;
        color: #f4f2ed;
      }

      .eyebrow {
        color: #b9c5bd;
        font-size: 12px;
        letter-spacing: .12em;
      }

      .idea-card h2 {
        padding-bottom: 8px;
        border-bottom: 1px solid #687173;
      }

      @media (max-width: 600px) {
        .page { padding: 20px 16px 32px; }
        .artwork-stage { height: 230px; }
        .bear { top: -76px; width: min(42vw, 210px); }
        .idea-card { padding: 22px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      {% capture readme_content %}{% include_relative README.md %}{% endcapture %}
      {{ readme_content | markdownify }}
    </main>
  </body>
</html>
